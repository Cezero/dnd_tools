          - paragraph [ref=f10e121]: This being looks like a beautiful human, with calm, serene features and an inner radiance that shines from its face.
          - generic [ref=f10e122]:
            - generic [ref=f10e123]:
              - button:
                - button [expanded] [ref=f10e124]
              - paragraph [ref=f10e129]: Planetouched is a general word to describe someone who can trace his or her bloodline back to an outsider, usually a fiend or celestial. The effects of having a supernatural being in one's heritage last for many generations. Although not as dramatically altered as a half-celestial or a half-fiend, planetouched still retain some special qualities. The two planetouched varieties described here are the most common. Aasimars are humans with some trace of celestial blood in their veins, and tieflings have some fiendishness in their family tree. There is no "typical" aasimar or tiefling. They do not have their own societies or cultures, instead blending into existing ones. Many have character classes.
            - paragraph [ref=f10e132]: "Graced with a touch of the holy, aasimars are usually tall, good-looking, and generally pleasant. Some have a minor physical trait suggesting their heritage, such as silver hair, golden eyes, or an unnaturally intense stare. Most aasimars are decidedly good-aligned. They fight against evil causes and attempt to sway others to do the right thing. Occasionally they take on the vengeful, judgmental aspect of their celestial ancestor, but this is rare. They are rarely found in leadership positions and often live as loners due to their absolute dedication to goodness. Others are less fanatical and fit seamlessly into normal human society. The aasimar warrior presented here had the following ability scores before racial adjustments: Str 13, Dex 11, Con 12, Int 10, Wis 9, Cha 8."
          - generic [ref=f10e133]:
            - heading "Combat" [level=2] [ref=f10e134]
            - paragraph [ref=f10e137]: Aasimars usually like a fair, straightforward contest. Against a particularly evil foe, however, they fight with utter conviction and to the death.
          - generic [ref=f10e138]:
            - paragraph [ref=f10e141]:
              - strong [ref=f10e142]: Daylight (Sp)
              - text: ": An aasimar can use"
              - link "Daylight" [ref=f10e143] [cursor=pointer]:
                - /url: /spells/575
              - text: once per day as a 1st-level caster or a caster of his class levels, whichever is higher.
            - paragraph [ref=f10e146]:
              - strong [ref=f10e147]: Skills (Ex)
              - text: ": An aasimar has a +2 racial bonus on Spot and Listen checks."
