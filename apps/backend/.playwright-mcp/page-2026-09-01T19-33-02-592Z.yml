                - generic [ref=f21e610]:
                  - generic [ref=f21e611]:
                    - heading "Level 1" [level=4] [ref=f21e612]
                    - generic [ref=f21e613]:
                      - generic [ref=f21e616]:
                        - paragraph [ref=f21e617]:
                          - strong [ref=f21e618]: "School Specialization:"
                          - text: A school is one of eight groupings of spells, each defined by a common theme, such as illusion or necromancy. If desired, a wizard may specialize in one school of magic. Specialization allows a wizard to cast extra spells from her chosen school, but she then never learns to cast spells from some other schools. Essentially, the wizard gains exceptional mastery over a single school by neglecting the study of other schools.
                        - paragraph [ref=f21e619]: A specialist wizard can prepare one additional spell of her specialty school per spell level each day. She also gains a +2 bonus on Spellcraft checks to learn the spells of her chosen school.
                        - paragraph [ref=f21e620]: The wizard must choose whether to specialize and, if she does so, choose her specialty at 1st level. At this time, she must also give up two other schools of magic (unless she chooses to specialize in divination; see below), which become her prohibited schools. For instance, if she chooses to specialize in conjuration, she might decide to give up enchantment and necromancy, or evocation and transmutation. A wizard can never give up divination to fulfill this requirement. Spells of the prohibited school or schools are not available to the wizard, and she can’t even cast such spells from scrolls or fire them from wands. She may not change either her specialization or her prohibited schools later.
                        - paragraph [ref=f21e621]: The eight schools of arcane magic are abjuration, conjuration, divination, enchantment, evocation, illusion, necromancy, and transmutation. Spells that do not fall into any of these schools are called universal spells.
                        - paragraph [ref=f21e622]:
                          - emphasis [ref=f21e623]: "Abjuration:"
                          - text: Spells that protect, block, or banish. An abjuration specialist is called an abjurer.
                        - paragraph [ref=f21e624]:
                          - emphasis [ref=f21e625]: "Conjuration:"
                          - text: Spells that bring creatures or materials to the caster. A conjuration specialist is called a conjurer.
                        - paragraph [ref=f21e626]:
                          - emphasis [ref=f21e627]: "Divination:"
                          - text: Spells that reveal information. A divination specialist is called a diviner. Unlike the other specialists, a diviner must give up only one other school.
                        - paragraph [ref=f21e628]:
                          - emphasis [ref=f21e629]: "Enchantment:"
                          - text: Spells that imbue the recipient with some property or grant the caster power over another being. An enchantment specialist is called an enchanter.
                        - paragraph [ref=f21e630]:
                          - emphasis [ref=f21e631]: "Evocation:"
                          - text: Spells that manipulate energy or create something from nothing. An evocation specialist is called an evoker.
                        - paragraph [ref=f21e632]:
                          - emphasis [ref=f21e633]: "Illusion:"
                          - text: Spells that alter perception or create false images. An illusion specialist is called an illusionist.
                        - paragraph [ref=f21e634]:
                          - emphasis [ref=f21e635]: "Necromancy:"
                          - text: Spells that manipulate, create, or destroy life or life force. A necromancy specialist is called a necromancer.
                        - paragraph [ref=f21e636]:
                          - emphasis [ref=f21e637]: "Transmutation:"
                          - text: Spells that transform the recipient physically or change its properties in a more subtle way. A transmutation specialist is called a transmuter.
                        - paragraph [ref=f21e638]:
                          - emphasis [ref=f21e639]: "Universal:"
                          - text: Not a school, but a category for spells that all wizards can learn. A wizard cannot select universal as a specialty school or as a prohibited school. Only a limited number of spells fall into this category.
                      - paragraph [ref=f21e643]:
                        - strong [ref=f21e644]: "Armor Restriction:"
                        - text: Armor of any type interferes with a wizard’s movements, which can cause her spells with somatic components to fail.
                      - generic [ref=f21e646]:
                        - generic [ref=f21e647]:
                          - paragraph [ref=f21e648]:
                            - strong [ref=f21e649]: "Familiar:"
                            - text: A wizard can obtain a familiar. Doing so takes 24 hours and uses up magical materials that cost 100 gp. A familiar is a magical beast that resembles a small animal and is unusually tough and intelligent. The creature serves as a companion and servant.
                          - paragraph [ref=f21e650]: The wizard chooses the kind of familiar he gets. As the wizard advances in level, his familiar also increases in power.
                          - paragraph [ref=f21e651]: If the familiar dies or is dismissed by the wizard, the wizard must attempt a DC 15 Fortitude saving throw. Failure means he loses 200 experience points per wizard level; success reduces the loss to one-half that amount. However, a wizard’s experience point total can never go below 0 as the result of a familiar’s demise or dismissal. For example, suppose that Hennet is a 3rd level wizard with 3,230 XP when his owl familiar is killed by a bugbear. Hennet makes a successful saving throw, so he loses 300 XP, dropping him below 3,000 XP and back to 2nd level. A slain or dismissed familiar cannot be replaced for a year and day. A slain familiar can be raised from the dead just as a character can be, and it does not lose a level or a Constitution point when this happy event occurs.
                          - paragraph [ref=f21e652]: A character with more than one class that grants a familiar may have only one familiar at a time.
                        - text: Select Familiar
                      - generic [ref=f21e654]:
                        - paragraph [ref=f21e656]:
                          - strong [ref=f21e657]: "Scribe Scroll:"
                          - text: At 1st level, a wizard gains Scribe Scroll as a bonus feat. This feats enables her to create magic scrolls.
                        - text: "Granted Feat: Scribe Scroll"
                      - generic [ref=f21e659]:
                        - generic [ref=f21e660]:
                          - paragraph [ref=f21e661]:
                            - strong [ref=f21e662]: "Spellbooks:"
                            - text: A wizard must study her spellbook each day to prepare her spells. She cannot prepare any spell not recorded in her spellbook, except for read magic, which all wizards can prepare from memory.
                          - paragraph [ref=f21e663]: A wizard begins play with a spellbook containing all 0-level wizard spells (except those from her prohibited school or schools, if any) plus three 1st-level spells of your choice. For each point of Intelligence bonus the wizard has, the spellbook holds one additional 1st-level spell of your choice. At each new wizard level, she gains two new spells of any spell level or levels that she can cast (based on her new wizard level) for her spellbook. For example, when a wizard attains 5th level, she can cast 3rd-level spells. At this point, she can add two new 3rd-level spells to her spellbook, or one 2nd-level spell and one 3rd-level spell, or any combination of two spells between 1st and 3rd level. At any time, a wizard can also add spells found in other wizards’ spellbooks to her own.
                        - text: "Choose a Spellbook Spell: (3), All 0th (Cantrip) level spells"
                      - generic [ref=f21e665]:
                        - paragraph [ref=f21e667]:
                          - strong [ref=f21e668]: "Bonus Languages:"
                          - text: A wizard may substitute Draconic for one of the bonus languages available to the character because of her race. Many ancient tomes of magic are written in Draconic, and apprentice wizards often learn it as part of their studies.
                        - text: "Bonus Language: Draconic"
                      - generic [ref=f21e671]:
                        - paragraph [ref=f21e672]:
                          - strong [ref=f21e673]: "Spells:"
                          - text: A wizard casts arcane spells (the same type of spells available to sorcerers and bards), which are drawn from the sorcerer/wizard spell list. A wizard must choose and prepare her spells ahead of time.
                        - paragraph [ref=f21e674]: To learn, prepare, or cast a spell, the wizard must have an Intelligence score equal to at least 10 + the spell level (Int 10 for 0-level spells, Int 11 for 1st-level spells, and so forth). The Difficulty Class for a saving throw against a wizard’s spell is 10 + the spell level + the wizard’s Intelligence modifier.
                        - paragraph [ref=f21e675]: Like other spellcasters, a wizard can cast only a certain number of spells of each spell level per day. Her base daily spell allotment is given on the Spells per Day table. In addition, she receives bonus spells per day if she has a high Intelligence score.
                        - paragraph [ref=f21e676]: Unlike a bard or sorcerer, a wizard may know any number of spells. She must choose and prepare her spells ahead of time by getting a good night’s sleep and spending 1 hour studying her spellbook. While studying, the wizard decides which spells to prepare.
