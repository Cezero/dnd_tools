                  - generic [ref=f21e323]:
                    - paragraph [ref=f21e324]: Most humans are the descendants of pioneers, conquerors, traders, travelers, refugees, and other people on the move. As a result, human lands are home to a mix of people-physically, culturally, religiously, and politically different. Hardy or fine, light-skinned or dark, showy or austere, primitive or civilized, devout or impious, humans run the gamut.
                    - paragraph [ref=f21e325]:
                      - strong [ref=f21e326]: "Personality:"
                      - text: Humans are the most adaptable, flexible, and ambitious people among the common races. They are diverse in their tastes, morals, customs, and habits. Others accuse them of having little respect for history, but it's only natural that humans, with their relatively short life spans and constantly changing cultures, would have a shorter collective memory than dwarves, elves, gnomes, or halflings.
                    - paragraph [ref=f21e327]:
                      - strong [ref=f21e328]: "Physical Description:"
                      - text: Humans typically stand from 5 feet to a little over 6 feet tall and weigh from 125 to 250 pounds, with men noticeably taller and heavier than women. Thanks to their penchant for migration and conquest, and to their short life spans, humans are more physically diverse than other common races. Their skin shades range from nearly black to very pale, their hair from black to blond (curly, kinky, or straight), and their facial hair (for men) from sparse to thick. Plenty of humans have a dash of nonhuman blood, and they may demonstrate hints of elf, orc, or other lineages. Members of this race are often ostentatious or unorthodox in their grooming and dress, sporting unusual hairstyles, fanciful clothes, tattoos, body piercings, and the like. Humans reach adulthood around age 15 and have relatively short lifespans, rarely living beyond a single century.
                    - paragraph [ref=f21e329]:
                      - strong [ref=f21e330]: "Relations:"
                      - text: Just as readily as they mix with each other, humans mix with members of other races, among which they are known as "everyone's second-best friends." Humans serve as ambassadors,diplomats, magistrates, merchants, and functionaries of all kinds.
                    - paragraph [ref=f21e331]:
                      - strong [ref=f21e332]: "Alignment:"
                      - text: Humans tend toward no particular alignment, not even neutrality. The best and the worst are found among them.
                    - paragraph [ref=f21e333]:
                      - strong [ref=f21e334]: "Human Lands:"
                      - text: Human lands are usually in flux, with new ideas,social changes, innovations, and new leaders constantly coming to the fore. Members of longer-lived races find human culture exciting but eventually a little wearying or even bewildering.
                    - paragraph [ref=f21e335]: Since humans lead such short lives, their leaders are all young compared to the political, religious, and military leaders among the other races. Even where individual humans are conservative traditionalists, human institutions change with the generations,adapting and evolving faster than parallel institutions among the elves, dwarves, gnomes, and halflings. Individually and as a group,humans are adaptable opportunists, and they stay on top of changing political dynamics.
                    - paragraph [ref=f21e336]: Human lands generally include relatively large numbers of nonhumans (compared, for instance, to the number of non-dwarves who live in dwarven lands)
                    - paragraph [ref=f21e337]:
                      - strong [ref=f21e338]: "Religion:"
                      - text: Unlike members of the other common races, humans do not have a chief racial deity. Pelor, the sun god, is the most commonly worshiped deity in human lands, but he can claim nothing like the central place that the dwarves give Moradin or the elves give Corellon Larethian in their respective pantheons. Some humans are the most ardent and zealous adherents of a given religion, while others are the most impious people around
                    - paragraph [ref=f21e339]:
                      - strong [ref=f21e340]: "Language:"
                      - text: "Humans speak Common. They typically learn other languages as well, including obscure ones, and they are fond of sprinkling their speech with words borrowed from other tongues: Orc curses, Elven musical expressions, Dwarven military phrases, and so on."
                    - paragraph [ref=f21e341]:
                      - strong [ref=f21e342]: "Names:"
                      - text: Human names vary greatly. Without a unifying deity to give them a touchstone for their culture, and with such a fast breeding cycle, humans mutate socially at a fast rate. Human culture, therefore, is more diverse than other cultures, and no human names are truly typical. Some human parents give their children dwarven or elven names (pronounced more or less correctly)
                    - paragraph [ref=f21e343]:
                      - strong [ref=f21e344]: "Adventurers:"
                      - text: Human adventurers are the most audacious, daring, and ambitious members of an audacious, daring, and ambitious race. A human can earn glory in the eyes of her fellows by amassing power, wealth, and fame. Humans, more than other people, champion causes rather than territories or groups.
