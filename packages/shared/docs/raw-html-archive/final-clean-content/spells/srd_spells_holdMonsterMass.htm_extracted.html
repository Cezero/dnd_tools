    <h1>Hold Monster, Mass</h1><h4><a href="/srd/magicOverview/spellDescriptions.htm#enchantment">Enchantment</a> (<a href="/srd/magicOverview/spellDescriptions.htm#compulsion">Compulsion</a>) [<a href="/srd/magicOverview/spellDescriptions.htm#descriptor">Mind-Affecting</a>]</h4><table cellspacing="0" class="statBlock">
<tr>
<th><a href="/srd/magicOverview/spellDescriptions.htm#level">Level</a>:</th>
<td><a href="/srd/spellLists/sorcererWizardSpells.htm#ninthLevelSorcererWizardSpells">Sor/Wiz 9</a></td>
</tr>
<tr>
<th><a href="/srd/magicOverview/spellDescriptions.htm#targetorTargets">Targets</a>:</th>
<td>One or more creatures, no two of which can be more than 30 ft. apart</td>
</tr>
</table><p>
	This spell functions like <a class="spell" href="/srd/spells/holdPerson.htm">hold person</a>, except that it affects multiple creatures and holds any living creature that fails its <a href="/srd/combat/combatStatistics.htm#will">Will save</a>.
</p>
