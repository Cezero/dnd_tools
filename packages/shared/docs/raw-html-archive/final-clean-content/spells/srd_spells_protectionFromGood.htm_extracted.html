    <h1>Protection from Good</h1><h4><a href="/srd/magicOverview/spellDescriptions.htm#abjuration">Abjuration</a> [<a href="/srd/magicOverview/spellDescriptions.htm#descriptor">Evil</a>]</h4><table cellspacing="0" class="statBlock">
<tr>
<th><a href="/srd/magicOverview/spellDescriptions.htm#level">Level</a>:</th>
<td><a href="/srd/spellLists/clericSpells.htm#firstLevelClericSpells">Clr 1</a>, <a href="/srd/spellLists/clericDomains.htm#evilDomain">Evil 1</a>, <a href="/srd/spellLists/sorcererWizardSpells.htm#firstLevelSorcererWizardSpells">Sor/Wiz 1</a></td>
</tr>
</table><p>
	This spell functions like <a class="spell" href="/srd/spells/protectionFromEvil.htm">protection from evil</a>, except that the <a href="/srd/theBasics.htm#deflectionBonus">deflection</a> and <a href="/srd/theBasics.htm#resistanceBonus">resistance bonuses</a> apply to attacks from good creatures, and good summoned creatures cannot touch the subject.
</p>
