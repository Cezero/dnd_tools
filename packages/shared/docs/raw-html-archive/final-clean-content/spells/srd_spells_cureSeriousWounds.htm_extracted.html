    <h1>Cure Serious Wounds</h1><h4><a href="/srd/magicOverview/spellDescriptions.htm#conjuration">Conjuration</a> (<a href="/srd/magicOverview/spellDescriptions.htm#healing">Healing</a>)</h4><table cellspacing="0" class="statBlock">
<tr>
<th><a href="/srd/magicOverview/spellDescriptions.htm#level">Level</a>:</th>

</table><p>
