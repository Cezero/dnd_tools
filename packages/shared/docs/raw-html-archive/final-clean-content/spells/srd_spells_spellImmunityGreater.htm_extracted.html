    <h1>Spell Immunity, Greater</h1><h4><a href="/srd/magicOverview/spellDescriptions.htm#abjuration">Abjuration</a></h4><table cellspacing="0" class="statBlock">
<tr>
<th><a href="/srd/magicOverview/spellDescriptions.htm#level">Level</a>:</th>
<td><a href="/srd/spellLists/clericSpells.htm#eighthLevelClericSpells">Clr 8</a></td>

	This spell functions like <a class="spell" href="/srd/spells/spellImmunity.htm">spell immunity</a>, except the immunity applies to spells of 8th level or lower.
