    <h1>Call Lightning Storm</h1><h4><a href="/srd/magicOverview/spellDescriptions.htm#evocation">Evocation</a> [<a href="/srd/magicOverview/spellDescriptions.htm#descriptor">Electricity</a>]</h4><table cellspacing="0" class="statBlock">
<tr>
<th><a href="/srd/magicOverview/spellDescriptions.htm#level">Level</a>:</th>
<td><a href="/srd/spellLists/druidSpells.htm#fifthLevelDruidSpells">Drd 5</a></td>
</tr>
<tr>
<th><a href="/srd/magicOverview/spellDescriptions.htm#range">Range</a>:</th>
<td>Long (400 ft. + 40 ft./level)</td>
</tr>
</table><p>
	This spell functions like <a class="spell" href="/srd/spells/callLightning.htm">call lightning</a>, except that each bolt deals <a class="diceRoller" href="javascript:void(0);" onclick="rollValue('Total','5d6');" title="Roll the dice!">5d6</a> points of electricity damage (or <a class="diceRoller" href="javascript:void(0);" onclick="rollValue('Total','5d10');" title="Roll the dice!">5d10</a> if created outdoors in a stormy area), and you may call a maximum of 15 bolts.
</p>
