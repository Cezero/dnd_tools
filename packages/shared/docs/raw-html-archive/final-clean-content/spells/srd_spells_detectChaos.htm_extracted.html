    <h1>Detect Chaos</h1><h4><a href="/srd/magicOverview/spellDescriptions.htm#divination">Divination</a></h4><table cellspacing="0" class="statBlock">
<tr>
<th><a href="/srd/magicOverview/spellDescriptions.htm#level">Level</a>:</th>
<td><a href="/srd/spellLists/clericSpells.htm#firstLevelClericSpells">Clr 1</a></td>
</tr>
</table><p>
	This spell functions like <a class="spell" href="/srd/spells/detectEvil.htm">detect evil</a>, except that it detects the auras of chaotic creatures, <a href="/srd/classes/cleric.htm">clerics</a> of chaotic deities, chaotic spells, and chaotic magic items, and you are vulnerable to an overwhelming chaotic aura if you are lawful.
