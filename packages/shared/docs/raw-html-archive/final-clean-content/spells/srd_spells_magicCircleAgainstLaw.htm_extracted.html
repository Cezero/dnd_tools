    <h1>Magic Circle against Law</h1><h4><a href="/srd/magicOverview/spellDescriptions.htm#abjuration">Abjuration</a> [<a href="/srd/magicOverview/spellDescriptions.htm#descriptor">Chaotic</a>]</h4><table cellspacing="0" class="statBlock">
<tr>
<th><a href="/srd/magicOverview/spellDescriptions.htm#level">Level</a>:</th>
<td><a href="/srd/spellLists/clericDomains.htm#chaosDomain">Chaos 3</a>, <a href="/srd/spellLists/clericSpells.htm#thirdLevelClericSpells">Clr 3</a>, <a href="/srd/spellLists/sorcererWizardSpells.htm#thirdLevelSorcererWizardSpells">Sor/Wiz 3</a></td>
</tr>
</table><p>
	This spell functions like <a class="spell" href="/srd/spells/magicCircleAgainstEvil.htm">magic circle against evil</a>, except that it is similar to <a class="spell" href="/srd/spells/protectionFromLaw.htm">protection from law</a> instead of <a class="spell" href="/srd/spells/protectionFromEvil.htm">protection from evil</a>, and it can imprison a nonchaotic called creature.
</p>
