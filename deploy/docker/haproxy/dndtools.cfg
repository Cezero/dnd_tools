# Append to /etc/haproxy/haproxy.cfg on cyberlb01 (keep existing MQTT/dashboard).

# Local Prometheus scrape for Netdata. Do not bind this on *:8404.
frontend netdata_haproxy
    mode http
    bind 127.0.0.1:8404
    http-request use-service prometheus-exporter if { path /metrics }
    stats enable
    stats uri /stats
    stats refresh 10s

