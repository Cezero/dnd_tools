# ---------------------------------------------------------------------
# MySQL — cybersql.local.cyberdeck.org (already DNS to this LB)
# Router :6446 is the InnoDB Cluster read-write port (current PRIMARY).
# ---------------------------------------------------------------------
frontend mysql_rw
    mode tcp
    bind *:3306
    timeout client 3h
    default_backend mysql_rw

backend mysql_rw
    mode tcp
    balance leastconn
    # mysql-check completes a handshake so Router does not 1129-block the LB
    # after tcp-check RSTs. User is haproxy@% (USAGE, empty native password).
    option mysql-check user haproxy post-41
    timeout server 3h
    server dock01 192.168.0.89:6446 check inter 5s rise 2 fall 3
    server dock02 192.168.0.90:6446 check inter 5s rise 2 fall 3
    server dock03 192.168.0.93:6446 check inter 5s rise 2 fall 3

# ---------------------------------------------------------------------
# Redis — redis.local.cyberdeck.org (CNAME to this LB)
# Cluster seed only: MOVED redirects go to dock IPs. Use cluster mode.
# :6379 are masters. Do not send writes at :6380 (replicas).
# ---------------------------------------------------------------------
frontend redis_cluster
    mode tcp
    bind *:6379
    timeout client 3h
    default_backend redis_masters

backend redis_masters
    mode tcp
    balance leastconn
    option tcp-check
    timeout server 3h
    server dock01 192.168.0.89:6379 check inter 5s rise 2 fall 3
    server dock02 192.168.0.90:6379 check inter 5s rise 2 fall 3
    server dock03 192.168.0.93:6379 check inter 5s rise 2 fall 3

# ---------------------------------------------------------------------
# dnd_tools HTTP
# ---------------------------------------------------------------------
frontend dndtools_http
    mode http
    bind *:80
    timeout client 60s
    acl host_dnd hdr(host) -i dndtools.local.cyberdeck.org
    acl is_api path_beg /api
    acl is_ws path_beg /ws
    http-request deny unless host_dnd
    use_backend dnd_backend if is_api
    use_backend dnd_backend if is_ws
    use_backend dnd_frontend if host_dnd

backend dnd_backend
    mode http
    balance roundrobin
    option httpchk GET /health
    timeout server 60s
    timeout tunnel 1h
    cookie SERVERID insert indirect nocache
    server dock01 192.168.0.89:3001 check cookie d1
    server dock02 192.168.0.90:3001 check cookie d2
    server dock03 192.168.0.93:3001 check cookie d3

backend dnd_frontend
    mode http
    balance roundrobin
    option httpchk GET /
    timeout server 60s
    server dock01 192.168.0.89:5173 check
    server dock02 192.168.0.90:5173 check
    server dock03 192.168.0.93:5173 check
